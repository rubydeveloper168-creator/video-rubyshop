services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video_app
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - video_network
    volumes:
      - storage_data:/var/www/html/storage/app/public
      - hls_data:/var/www/html/public/hls
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: video_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root258369}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - video_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  storage_data:
  hls_data:

networks:
  video_network:
    driver: bridge
