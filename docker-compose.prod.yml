services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video_app
    ports:
      - "8080:80"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - video_network
    volumes:
      - storage_data:/var/www/html/storage/app/public
      - hls_data:/var/www/html/public/hls
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: video_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root258369}
      MYSQL_DATABASE: ${DB_DATABASE:-rubyshop_video}
    volumes:
      - mysql_data:/var/lib/mysql
      - /tmp/rubyshop_video_backup.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - video_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root258369}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  storage_data:
  hls_data:

networks:
  video_network:
    driver: bridge
